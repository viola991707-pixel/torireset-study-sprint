<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ToriReset Study Sprint</title>
<style>
:root{
  --bg:#FAF7F2;--card:#F4EFE8;--text:#3A3A3A;--muted:#756F68;
  --terracotta:#C97B63;--sage:#9CAF88;--border:#DED6CC;--shadow:0 8px 24px rgba(58,58,58,.08)
}
@media (prefers-color-scheme:dark){
  :root{--bg:#191817;--card:#24211E;--text:#F4EFE8;--muted:#B9B0A5;--border:#3B3631;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:auto}
body{width:100%;min-width:0}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:10px}
.widget{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.top{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center}
.timer{display:grid;place-items:center;aspect-ratio:1/1;border-radius:50%;border:8px solid rgba(156,175,136,.28);background:rgba(255,255,255,.06)}
.time{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1}
.status{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.controls{min-width:0}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700;margin-bottom:4px}
.tag{font-size:12px;color:var(--muted);margin-bottom:10px}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:8px}
button,input{font:inherit}
.preset,.ctl,.secondary{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:12px;min-height:38px;cursor:pointer}
.preset.active{background:rgba(156,175,136,.18);border-color:var(--sage)}
.preset b{display:block;font-size:16px}.preset small{display:block;font-size:9px;color:var(--muted)}
.custom{display:flex;gap:6px;margin-bottom:8px}\n.custom[hidden]{display:none!important}
.custom input{width:100%;min-width:0;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:12px;padding:9px 10px;outline:none}
.custom .secondary{padding:0 12px;white-space:nowrap}
.primary{width:100%;border:0;border-radius:999px;background:var(--terracotta);color:#1f1b18;font-weight:700;min-height:42px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.ctl{font-weight:600}
details{margin-top:8px;border-top:1px solid var(--border);padding-top:7px}
summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);list-style:none}
summary::-webkit-details-marker{display:none}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.field label{display:block;font-size:10px;font-weight:700;margin-bottom:4px}
.field input,.field textarea{width:100%;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:10px;padding:8px;outline:none;resize:none}
.field textarea{height:36px}
.done{display:none;margin-top:8px;padding:9px;border-radius:12px;background:rgba(156,175,136,.15);font-size:12px}
.done.show{display:block}
.done-actions{display:flex;gap:6px;margin-top:7px}.done-actions button{flex:1}
.foot{font-size:10px;color:var(--muted);text-align:center;margin-top:7px}
@media(max-width:540px){
  .wrap{padding:6px}
  .widget{padding:10px;border-radius:14px}
  .top{grid-template-columns:104px 1fr;gap:9px}
  .time{font-size:28px}
  .brand{font-size:18px}
  .tag{font-size:11px;margin-bottom:7px}
  .preset{min-height:34px}.preset b{font-size:14px}.preset small{font-size:8px}
  .primary{min-height:38px}
  .fields{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="widget" aria-label="ToriReset Study Sprint timer">
    <div class="top">
      <div class="timer">
        <div style="text-align:center">
          <div id="time" class="time">25:00</div>
          <div id="status" class="status">Ready</div>
        </div>
      </div>
      <div class="controls">
        <div class="brand">ToriReset</div>
        <div class="tag">One small visible action is enough.</div>
        <div class="presets">
          <button class="preset" data-min="10"><b>10</b><small>Just Start</small></button>
          <button class="preset active" data-min="25"><b>25</b><small>Focus Sprint</small></button>
          <button class="preset" data-min="45"><b>45</b><small>Deep Study</small></button>
          <button class="preset" id="customPreset"><b>⋯</b><small>Custom</small></button>
        </div>
        <div class="custom" id="customRow" hidden>
          <input id="custom" type="number" min="1" max="180" value="25" inputmode="numeric" aria-label="Custom minutes">
          <button class="secondary" id="setCustom">Set</button>
        </div>
        <button id="mainBtn" class="primary">Start</button>
        <div class="row">
          <button id="resetBtn" class="ctl">Reset</button>
          <button id="resumeBtn" class="ctl">Resume</button>
          <button id="stopBtn" class="ctl">Stop Here</button>
        </div>
      </div>
    </div>

    <details>
      <summary>＋ Add focus details (optional)</summary>
      <div class="fields">
        <div class="field">
          <label for="task">What am I working on?</label>
          <input id="task" autocomplete="off">
        </div>
        <div class="field">
          <label for="action">First visible action</label>
          <textarea id="action"></textarea>
        </div>
      </div>
      <div style="margin-top:7px;display:flex;justify-content:flex-end">
        <button id="clearDetails" class="secondary" type="button" style="min-height:32px;padding:0 12px">Clear details</button>
      </div>
    </details>

    <div id="done" class="done">
      <strong>Sprint complete.</strong> What next?
      <div class="done-actions">
        <button class="ctl" id="doneBtn">Done</button>
        <button class="ctl" id="againBtn">Keep Going</button>
        <button class="ctl" id="endBtn">Stop Here</button>
      </div>
    </div>
  </section>
</div>

<script>
let selectedMin=25, remaining=selectedMin*60, timerId=null, running=false;
const timeEl=document.getElementById('time'), statusEl=document.getElementById('status');
const mainBtn=document.getElementById('mainBtn'), resetBtn=document.getElementById('resetBtn');
const resumeBtn=document.getElementById('resumeBtn'), stopBtn=document.getElementById('stopBtn');
const done=document.getElementById('done');
function render(){
  const m=Math.floor(remaining/60), s=remaining%60;
  timeEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  statusEl.textContent=running?'Focus':'Ready';
  mainBtn.textContent=running?'Pause':'Start';
  resumeBtn.disabled=running||remaining===selectedMin*60||remaining===0;
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}running=false;render()}
function tick(){
  if(remaining>0){remaining--;render()}
  if(remaining<=0){stopTimer();statusEl.textContent='Complete';done.classList.add('show')}
}
function start(){if(remaining<=0)remaining=selectedMin*60;running=true;done.classList.remove('show');render();timerId=setInterval(tick,1000)}
function choose(min){
  stopTimer();selectedMin=min;remaining=min*60;done.classList.remove('show');
  document.getElementById('customRow').hidden=true;
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',Number(b.dataset.min)===min));
  render()
}
document.querySelectorAll('.preset[data-min]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.min))));
document.getElementById('customPreset').addEventListener('click',()=>{
  const row=document.getElementById('customRow');row.hidden=!row.hidden
});
document.getElementById('setCustom').addEventListener('click',()=>{
  let n=Math.round(Number(document.getElementById('custom').value)||25);n=Math.min(180,Math.max(1,n));
  document.getElementById('custom').value=n;choose(n);
  document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'));
  document.getElementById('customPreset').classList.add('active');
});
mainBtn.addEventListener('click',()=>running?stopTimer():start());
resumeBtn.addEventListener('click',()=>{if(!running&&remaining>0)start()});
resetBtn.addEventListener('click',()=>{stopTimer();remaining=selectedMin*60;done.classList.remove('show');render()});
stopBtn.addEventListener('click',()=>{stopTimer();statusEl.textContent='Stopped';done.classList.add('show')});
document.getElementById('againBtn').addEventListener('click',()=>{remaining=selectedMin*60;start()});
document.getElementById('doneBtn').addEventListener('click',()=>{stopTimer();statusEl.textContent='Done';done.classList.remove('show')});
document.getElementById('endBtn').addEventListener('click',()=>{stopTimer();statusEl.textContent='Stopped';done.classList.remove('show')});
document.getElementById('clearDetails').addEventListener('click',()=>{
  document.getElementById('task').value='';
  document.getElementById('action').value='';
  document.getElementById('task').focus();
});
render();
</script>
</body>
</html>
