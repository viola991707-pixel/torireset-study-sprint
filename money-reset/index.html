<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F2EA"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-title" content="Money Reset"><title>Money Reset by ToriReset</title><style>html,body{margin:0;min-height:100%;background:#F7F2EA;color:#3A3A3A;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.load{max-width:520px;margin:12vh auto;padding:28px 22px;text-align:center}.mark{width:48px;height:48px;border-radius:50%;background:#F6E3D8;margin:0 auto 16px;display:grid;place-items:center;color:#A8461F;font-weight:700}.muted{color:#6F655C;font-size:.9rem}.err{background:#FBEBC8;border-radius:14px;padding:14px;margin-top:18px;text-align:left}</style><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js"></script></head><body><main class="load"><div class="mark">MR</div><h1>Money Reset</h1><p class="muted" id="status">Opening your calm money plan…</p><div id="error"></div></main><script>(async()=>{try{if(!window.pako)throw new Error('The app helper could not load. Check your internet connection and reload.');const names=['01','02','03','04','05','06','07'];const parts=await Promise.all(names.map(n=>fetch('data-'+n+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('A Money Reset file could not be loaded.');return r.text();})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=pako.inflate(bytes,{to:'string'});if(!html.includes('Money Reset by ToriReset'))throw new Error('Money Reset did not unpack correctly.');document.open();document.write(html);document.close();}catch(e){document.getElementById('status').textContent='Money Reset could not open.';document.getElementById('error').innerHTML='<div class="err"><b>Try this:</b> reload the page in Safari or Chrome. If it still does not open, use the included offline HTML copy.<br><br><span class="muted">'+String(e&&e.message||e)+'</span></div>';}})();</script><!-- release 2026-11-02 --></body></html>
